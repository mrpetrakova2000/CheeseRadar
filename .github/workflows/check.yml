name: Code Check
on: push

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install and run pylint
        run: |
          pip install pylint pre-commit
          pre-commit run pylint --all-files