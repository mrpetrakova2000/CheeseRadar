name: pre-commit
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install pre-commit pylint black isort
      
      - name: Run pre-commit
        run: |
          pre-commit run --all-files