repos:
  - repo: local
    hooks:
      - id: pylint-autofix
        name: pylint autofix
        entry: python -m autopep8 --in-place --recursive
        language: system
        types: [python]
        pass_filenames: false
        args: [
          "--select=W0104,W1201,W1309,W1508,W0719,W0107",
          "--max-line-length=120",
          "--ignore=E501"
        ]
  
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
  
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
  
  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: python -m pylint
        language: system
        types: [python]
        args: ["--rcfile=.pylintrc", "--jobs=0"]